[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "screenagents"
version = "0.1.0"
description = "Cross-platform screen capture for humans and AI agents — no Playwright, no browser, no heavy dependencies."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Parithosh Varma" }]
keywords = ["screenshot", "screencapture", "screen-capture", "mcp", "cli", "agents", "wayland", "x11"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics :: Capture :: Screen Capture",
]
dependencies = []

[project.optional-dependencies]
# The mcp package itself requires Python 3.10+, so the extras marker keeps
# `pip install "screenagents[mcp]"` working (as a no-op) on 3.9.
mcp = ["mcp>=1.0,<2; python_version >= '3.10'"]
dev = ["pytest>=7"]

[project.scripts]
screenagents = "screenagents.cli:main"
screenagents-mcp = "screenagents.mcp_server:main"

[project.urls]
Homepage = "https://github.com/Parithosh-Varma/screenagents"
Issues = "https://github.com/Parithosh-Varma/screenagents/issues"

[tool.setuptools]
packages = ["screenagents"]

[tool.pytest.ini_options]
testpaths = ["tests"]
